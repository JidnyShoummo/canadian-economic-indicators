name: Daily CPI Refresh

on:
  schedule:
    - cron: '10 12 * * *'   # 8:10 AM EDT (summer) / 7:10 AM EST (winter)
    - cron: '10 13 * * *'   # 9:10 AM EDT (summer) / 8:10 AM EST (winter)
  workflow_dispatch: {}

permissions:
  contents: write   # needed so this workflow can push the regenerated site back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python scripts/cpi_main.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Generate site
        run: python scripts/generate_site.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Commit and push updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto-update site $(date +'%Y-%m-%d')"
          git push